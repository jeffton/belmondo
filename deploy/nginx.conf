server {
    listen 80;
    listen [::]:80;
    server_name belmondo.roybot.se;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/belmondo/acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Shared wildcard certificates allow browsers to reuse Batty's HTTP/2 connection.
    http2 on;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name belmondo.roybot.se;
    root /var/www/belmondo/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/roybot.se-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/roybot.se-wildcard/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        try_files $uri $uri/ =404;
    }
    location /assets/ {
        expires 1y;
    }
    location = /index.html {
        expires -1;
    }
    location ~ /\. {
        deny all;
    }
}

# Cached DNS for the retired hostname must not reach another virtual host.
server {
    http2 on;
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name antigrav.roybot.se;

    ssl_certificate /etc/letsencrypt/live/roybot.se-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/roybot.se-wildcard/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 410;
}
