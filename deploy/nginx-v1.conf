# Original playable prototype; isolated origin, storage and release directory.
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name belmondo-v1.roybot.se;
    root /var/www/belmondo-v1/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/roybot.se-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/roybot.se-wildcard/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ =404;
    }
    location /assets/ {
        expires 1y;
    }
    location = /index.html {
        expires -1;
    }
    location ~ /\. {
        deny all;
    }
}
